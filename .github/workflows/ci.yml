name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restaurar dependências
        run: dotnet restore MSRFinancialEngine.slnx

      - name: Compilar
        run: dotnet build MSRFinancialEngine.slnx --configuration Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Testar
        run: dotnet test MSRFinancialEngine.slnx --configuration Release --no-build --verbosity normal

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Validar build da imagem da API
        run: docker build -f src/MSRFinancialEngine.Api/Dockerfile -t msr-financial-engine:ci .
